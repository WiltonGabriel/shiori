spring.application.name=shiori-api

# ===================================================================
# BANCO DE DADOS (12-Factor / Environment Variables com Fallback Local)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shiori_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ===================================================================
# PADRÃO RFC 9457 (Problem Details)
# ===================================================================
spring.mvc.problemdetails.enabled=true

# ===================================================================
# PORTA DO SERVIDOR (12-Factor Port Binding)
# ===================================================================
server.port=${PORT:8080}
